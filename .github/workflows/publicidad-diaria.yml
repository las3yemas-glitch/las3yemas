name: Publicidad diaria Las 3 Yemas

on:
  workflow_dispatch:

jobs:
  publicar-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear imagen
        run: |
          mkdir -p publicidad

          cat > publicidad/publicidad.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350">
            <rect width="1080" height="1350" fill="#fff8e8"/>
            <text x="540" y="250" text-anchor="middle" font-family="Arial" font-size="82" font-weight="bold" fill="#5b3518">LAS 3 YEMAS</text>
            <text x="540" y="390" text-anchor="middle" font-family="Arial" font-size="55" fill="#5b3518">Huevos frescos</text>
            <text x="540" y="470" text-anchor="middle" font-family="Arial" font-size="42" fill="#5b3518">Directo a tu hogar</text>
            <text x="540" y="700" text-anchor="middle" font-family="Arial" font-size="46" fill="#5b3518">Repartos a domicilio</text>
            <text x="540" y="800" text-anchor="middle" font-family="Arial" font-size="36" fill="#5b3518">Viña del Mar · Valparaíso</text>
            <text x="540" y="860" text-anchor="middle" font-family="Arial" font-size="36" fill="#5b3518">Quilpué · Belloto · Villa Alemana</text>
            <text x="540" y="1080" text-anchor="middle" font-family="Arial" font-size="44" font-weight="bold" fill="#7a421b">PIDE POR WHATSAPP</text>
          </svg>
          EOF

          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert publicidad/publicidad.svg publicidad/publicidad-hoy.jpg

      - name: Guardar imagen
        run: |
          git config user.name "Las 3 Yemas Bot"
          git config user.email "bot@las3yemas.cl"
          git add publicidad/publicidad-hoy.jpg
          git diff --cached --quiet || git commit -m "Publicidad automática"
          git push

      - name: Publicar en Instagram
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          IMAGE_URL="https://raw.githubusercontent.com/las3yemas-glitch/las3yemas/main/publicidad/publicidad-hoy.jpg"

          IG_USER_ID=$(curl -s "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$IG_USER_ID" ]; then
            echo "No se pudo obtener el usuario de Instagram."
            exit 1
          fi

          CAPTION="🥚 Huevos frescos directo a tu hogar. 🚚 Repartimos en Viña del Mar, Valparaíso, Quilpué, Belloto y Villa Alemana. 📲 Haz tu pedido por WhatsApp o desde nuestra web. #Las3Yemas #HuevosFrescos"

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "image_url=${IMAGE_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$RESPONSE"

          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$CREATION_ID" ]; then
            echo "Instagram no creó el contenido."
            exit 1
          fi

          sleep 10

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$PUBLISH_RESPONSE"
