name: Publicidad diaria Las 3 Yemas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Seleccionar pieza del día
        id: contenido
        run: |
          # Día local America/Santiago. Sin campaña vigente repite la
          # rotación 0N_semana.png y la leyenda de siempre.
          python3 publicidad/seleccionar.py elegir --github-output

      - name: Preparar imagen
        run: |
          cp "${{ steps.contenido.outputs.IMAGEN }}" "publicidad/instagram-${GITHUB_RUN_ID}.png"

      - name: Guardar imagen
        id: guardar
        env:
          PENDIENTES: ${{ steps.contenido.outputs.PENDIENTES }}
        run: |
          git config user.name "Las 3 Yemas Bot"
          git config user.email "bot@las3yemas.cl"
          git add "publicidad/instagram-${GITHUB_RUN_ID}.png"
          # Registro durable: cada publicación queda "en_curso" antes de llamar a la red.
          python3 publicidad/seleccionar.py iniciar --fecha "${{ steps.contenido.outputs.FECHA_LOCAL }}" --pendientes "$PENDIENTES"
          if [ -f publicidad/registro-publicaciones.jsonl ]; then git add publicidad/registro-publicaciones.jsonl; fi
          git commit -m "Publicidad diaria Las 3 Yemas" || true
          git push

      - name: Esperar imagen pública
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.png"
          for i in {1..30}; do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "IMAGEN DISPONIBLE"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publicar en Instagram
        id: instagram
        if: steps.contenido.outputs.PUBLICAR_INSTAGRAM == 'true'
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CAPTION: ${{ steps.contenido.outputs.CAPTION }}
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.png"

          IG_USER_ID=$(curl -s \
            "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$IG_USER_ID" ]; then
            echo "No se obtuvo el ID de Instagram"
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "image_url=${IMAGE_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$RESPONSE"

          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$CREATION_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          sleep 10

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$PUBLISH_RESPONSE"

          PUBLISH_ID=$(echo "$PUBLISH_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$PUBLISH_ID" ]; then
            # media_publish sin ID: pudo quedar publicado o no. Revisar Instagram antes de reintentar.
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
          echo "REMOTE_ID=$PUBLISH_ID" >> "$GITHUB_OUTPUT"
          echo "INSTAGRAM PUBLICADO CORRECTAMENTE"

      # Si falla se marca en rojo, pero TikTok se ejecuta igual.
      - name: Publicar en Facebook
        id: facebook
        if: steps.contenido.outputs.PUBLICAR_FACEBOOK == 'true'
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          CAPTION: ${{ steps.contenido.outputs.CAPTION }}
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.png"
          PAGE_ID=1349788938213993
          TOKEN="$FACEBOOK_PAGE_ACCESS_TOKEN"

          # Si el secreto es un token de usuario / usuario del sistema,
          # se obtiene automáticamente el token de la página (no se imprime).
          PT=$(curl -s "https://graph.facebook.com/v26.0/${PAGE_ID}?fields=access_token&access_token=${TOKEN}" \
            | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('access_token',''))
          except Exception: print('')")
          if [ -n "$PT" ]; then
            echo "::add-mask::$PT"
            TOKEN="$PT"
            echo "Token de página obtenido automáticamente"
          else
            echo "Se usa el token guardado tal cual"
          fi

          RESP=$(curl -s -X POST \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/photos" \
            -d "url=${IMAGE_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            -d "access_token=${TOKEN}")
          echo "$RESP"

          if echo "$RESP" | grep -q '"post_id"\|"id"'; then
            FB_ID=$(echo "$RESP" | python3 -c "import sys,json
          d=json.load(sys.stdin); print(d.get('post_id') or d.get('id') or '')")
            echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
            echo "REMOTE_ID=$FB_ID" >> "$GITHUB_OUTPUT"
            echo "FACEBOOK PUBLICADO CORRECTAMENTE"
          else
            if echo "$RESP" | grep -q '"error"'; then
              echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            else
              echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            fi
            echo "FACEBOOK FALLÓ (revisa FACEBOOK_PAGE_ACCESS_TOKEN)"
            exit 1
          fi

      # Stories (solo campaña). Pasos independientes: si la cuenta no tiene
      # permiso para Stories, falla solo este paso y queda "fallido".
      - name: Publicar Story en Instagram
        id: story_instagram
        if: steps.contenido.outputs.PUBLICAR_STORY_INSTAGRAM == 'true'
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          STORY_URL: https://las3yemas-glitch.github.io/las3yemas/${{ steps.contenido.outputs.STORY }}
        run: |
          IG_USER_ID=$(curl -s \
            "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$IG_USER_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "image_url=${STORY_URL}" \
            -d "media_type=STORIES" \
            -d "access_token=${ACCESS_TOKEN}")
          echo "$RESPONSE"
          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$CREATION_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          sleep 10

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")
          echo "$PUBLISH_RESPONSE"
          PUBLISH_ID=$(echo "$PUBLISH_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$PUBLISH_ID" ]; then
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
          echo "REMOTE_ID=$PUBLISH_ID" >> "$GITHUB_OUTPUT"
          echo "STORY DE INSTAGRAM PUBLICADA"

      - name: Publicar Story en Facebook
        id: story_facebook
        if: steps.contenido.outputs.PUBLICAR_STORY_FACEBOOK == 'true'
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          STORY_URL: https://las3yemas-glitch.github.io/las3yemas/${{ steps.contenido.outputs.STORY }}
        run: |
          PAGE_ID=1349788938213993
          TOKEN="$FACEBOOK_PAGE_ACCESS_TOKEN"
          PT=$(curl -s "https://graph.facebook.com/v26.0/${PAGE_ID}?fields=access_token&access_token=${TOKEN}" \
            | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('access_token',''))
          except Exception: print('')")
          if [ -n "$PT" ]; then
            echo "::add-mask::$PT"
            TOKEN="$PT"
          fi

          # La foto se sube sin publicar y luego se usa como Story.
          PHOTO=$(curl -s -X POST \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/photos" \
            -d "url=${STORY_URL}" \
            -d "published=false" \
            -d "access_token=${TOKEN}")
          echo "$PHOTO"
          PHOTO_ID=$(echo "$PHOTO" | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('id',''))
          except Exception: print('')")
          if [ -z "$PHOTO_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESP=$(curl -s -X POST \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/photo_stories" \
            -d "photo_id=${PHOTO_ID}" \
            -d "access_token=${TOKEN}")
          echo "$RESP"
          POST_ID=$(echo "$RESP" | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('post_id',''))
          except Exception: print('')")
          if [ -n "$POST_ID" ]; then
            echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
            echo "REMOTE_ID=$POST_ID" >> "$GITHUB_OUTPUT"
            echo "STORY DE FACEBOOK PUBLICADA"
          elif echo "$RESP" | grep -q '"error"'; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Reels (solo con vídeo aprobado y fecha programada). Pasos independientes.
      - name: Publicar Reel en Instagram
        id: reel_instagram
        if: steps.contenido.outputs.PUBLICAR_REEL_INSTAGRAM == 'true'
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: https://las3yemas-glitch.github.io/las3yemas/${{ steps.contenido.outputs.REEL_VIDEO }}
          COVER_URL: https://las3yemas-glitch.github.io/las3yemas/${{ steps.contenido.outputs.REEL_PORTADA }}
          CAPTION: ${{ steps.contenido.outputs.REEL_CAPTION }}
        run: |
          IG_USER_ID=$(curl -s \
            "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$IG_USER_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "media_type=REELS" \
            -d "video_url=${VIDEO_URL}" \
            -d "cover_url=${COVER_URL}" \
            -d "share_to_feed=true" \
            --data-urlencode "caption=${CAPTION}" \
            -d "access_token=${ACCESS_TOKEN}")
          echo "$RESPONSE"
          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$CREATION_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Instagram procesa el vídeo antes de permitir publicarlo.
          for i in $(seq 1 10); do
            sleep 30
            ESTADO_IG=$(curl -s "https://graph.instagram.com/${CREATION_ID}?fields=status_code&access_token=${ACCESS_TOKEN}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status_code',''))")
            echo "Procesando ($i): $ESTADO_IG"
            [ "$ESTADO_IG" = "FINISHED" ] && break
            if [ "$ESTADO_IG" = "ERROR" ] || [ "$i" = "10" ]; then
              echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")
          echo "$PUBLISH_RESPONSE"
          PUBLISH_ID=$(echo "$PUBLISH_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$PUBLISH_ID" ]; then
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
          echo "REMOTE_ID=$PUBLISH_ID" >> "$GITHUB_OUTPUT"
          echo "REEL DE INSTAGRAM PUBLICADO"

      - name: Publicar Reel en Facebook
        id: reel_facebook
        if: steps.contenido.outputs.PUBLICAR_REEL_FACEBOOK == 'true'
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          VIDEO_URL: https://las3yemas-glitch.github.io/las3yemas/${{ steps.contenido.outputs.REEL_VIDEO }}
          CAPTION: ${{ steps.contenido.outputs.REEL_CAPTION }}
        run: |
          PAGE_ID=1349788938213993
          TOKEN="$FACEBOOK_PAGE_ACCESS_TOKEN"
          PT=$(curl -s "https://graph.facebook.com/v26.0/${PAGE_ID}?fields=access_token&access_token=${TOKEN}" \
            | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('access_token',''))
          except Exception: print('')")
          if [ -n "$PT" ]; then
            echo "::add-mask::$PT"
            TOKEN="$PT"
          fi
          campo() { python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('$1',''))
          except Exception: print('')"; }

          # 1) iniciar, 2) Facebook descarga el MP4 desde la URL pública, 3) publicar.
          START=$(curl -s -X POST "https://graph.facebook.com/v26.0/${PAGE_ID}/video_reels" \
            -d "upload_phase=start" -d "access_token=${TOKEN}")
          echo "$START"
          VIDEO_ID=$(echo "$START" | campo video_id)
          if [ -z "$VIDEO_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          UPLOAD=$(curl -s -X POST "https://rupload.facebook.com/video-upload/v26.0/${VIDEO_ID}" \
            -H "Authorization: OAuth ${TOKEN}" \
            -H "file_url: ${VIDEO_URL}")
          echo "$UPLOAD"
          if [ "$(echo "$UPLOAD" | campo success)" != "True" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          FINISH=$(curl -s -X POST "https://graph.facebook.com/v26.0/${PAGE_ID}/video_reels" \
            -d "upload_phase=finish" \
            -d "video_id=${VIDEO_ID}" \
            -d "video_state=PUBLISHED" \
            --data-urlencode "description=${CAPTION}" \
            -d "access_token=${TOKEN}")
          echo "$FINISH"
          if [ "$(echo "$FINISH" | campo success)" = "True" ]; then
            echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
            echo "REMOTE_ID=$VIDEO_ID" >> "$GITHUB_OUTPUT"
            echo "REEL DE FACEBOOK ENVIADO"
          elif echo "$FINISH" | grep -q '"error"'; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # No debe romper el job si falla: Instagram y Facebook ya se
      # publicaron en los pasos anteriores independientemente del resultado
      # de este paso.
      - name: Publicar en TikTok
        id: tiktok
        if: steps.contenido.outputs.PUBLICAR_TIKTOK == 'true'
        continue-on-error: true
        env:
          TIKTOK_AUTOMATION_SECRET: ${{ secrets.TIKTOK_AUTOMATION_SECRET }}
          RENDER_TIKTOK_URL: ${{ vars.RENDER_TIKTOK_URL }}
          TIKTOK_IMAGEN: ${{ steps.contenido.outputs.TIKTOK_IMAGEN }}
          CAPTION: ${{ steps.contenido.outputs.CAPTION }}
        run: |
          URL="$RENDER_TIKTOK_URL"
          case "$URL" in
            https://*) ;;
            *)
              echo "RENDER_TIKTOK_URL vacía o inválida; se usa la URL por defecto"
              URL="https://las3yemas-tiktok.onrender.com"
              ;;
          esac

          # En campaña se pide el JPG de la pieza del día; sin campaña el
          # servidor usa su imagen 0N_semana.jpg de siempre.
          BODY='{}'
          if [ -n "$TIKTOK_IMAGEN" ]; then
            BODY=$(python3 -c "import json,os; print(json.dumps({'imageUrl': 'https://las3yemas-glitch.github.io/las3yemas/' + os.environ['TIKTOK_IMAGEN'], 'caption': os.environ['CAPTION']}))")
          fi

          HTTP_STATUS=$(curl -s --max-time 120 -o /tmp/tiktok_response.json -w "%{http_code}" -X POST \
            "${URL%/}/tiktok/publish" \
            -H "Authorization: Bearer ${TIKTOK_AUTOMATION_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY") || true

          echo "HTTP $HTTP_STATUS"
          cat /tmp/tiktok_response.json || true

          if [ "$HTTP_STATUS" != "200" ]; then
            if [ "$HTTP_STATUS" = "000" ]; then
              echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            else
              echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            fi
            echo "La publicación en TikTok falló. Revisa los logs de Render (esto no afecta a Instagram/Facebook, que ya se publicaron)."
            exit 1
          fi

          PUBLISH_ID=$(python3 -c "import json; print(json.load(open('/tmp/tiktok_response.json')).get('publish_id') or '')" || true)
          if [ -n "$PUBLISH_ID" ]; then
            echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
            echo "REMOTE_ID=$PUBLISH_ID" >> "$GITHUB_OUTPUT"
          else
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
          fi

          echo "TIKTOK PUBLICADO CORRECTAMENTE"

      - name: Enviar Reel a TikTok (borrador)
        id: reel_tiktok
        if: steps.contenido.outputs.PUBLICAR_REEL_TIKTOK == 'true'
        continue-on-error: true
        env:
          TIKTOK_AUTOMATION_SECRET: ${{ secrets.TIKTOK_AUTOMATION_SECRET }}
          RENDER_TIKTOK_URL: ${{ vars.RENDER_TIKTOK_URL }}
          REEL_VIDEO: ${{ steps.contenido.outputs.REEL_VIDEO }}
        run: |
          URL="$RENDER_TIKTOK_URL"
          case "$URL" in
            https://*) ;;
            *) URL="https://las3yemas-tiktok.onrender.com" ;;
          esac
          BODY=$(python3 -c "import json,os; print(json.dumps({'videoUrl': 'https://las3yemas-glitch.github.io/las3yemas/' + os.environ['REEL_VIDEO']}))")
          HTTP_STATUS=$(curl -s --max-time 120 -o /tmp/tiktok_reel.json -w "%{http_code}" -X POST \
            "${URL%/}/tiktok/publish" \
            -H "Authorization: Bearer ${TIKTOK_AUTOMATION_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY") || true
          echo "HTTP $HTTP_STATUS"
          cat /tmp/tiktok_reel.json || true
          if [ "$HTTP_STATUS" != "200" ]; then
            if [ "$HTTP_STATUS" = "000" ]; then
              echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            else
              echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          RESULTADO=$(python3 -c "import json; d=json.load(open('/tmp/tiktok_reel.json')); print(d.get('publish_id') or '', d.get('mediaType') or '')" || true)
          set -- $RESULTADO
          if [ -n "$1" ] && [ "$2" = "VIDEO" ]; then
            echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
            echo "REMOTE_ID=$1" >> "$GITHUB_OUTPUT"
            echo "REEL ENVIADO A LA BANDEJA DE TIKTOK"
          else
            # Servidor sin soporte de vídeo (versión antigua) o sin publish_id.
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Registro durable. "publicado" exige ID remoto; si el paso no dejó
      # estado queda "desconocido" y no se reintenta solo (ver conciliar.py).
      - name: Registrar resultado
        # Solo si "en_curso" llegó al repositorio; si no, no hay nada que cerrar.
        if: always() && steps.guardar.outcome == 'success'
        run: |
          registrar() {
            CAMPANA="$1"; ASSET="$2"; CANAL="$3"; FORMATO="$4"; PUB="$5"; OUTCOME="$6"; ESTADO="$7"; RID="$8"
            [ "$PUB" = "true" ] || return 0
            if [ "$OUTCOME" = "skipped" ]; then
              ESTADO="fallido"; DET="paso no ejecutado"
            else
              ESTADO="${ESTADO:-desconocido}"; DET="outcome=$OUTCOME"
            fi
            if [ "$ESTADO" = "publicado" ] && [ -z "$RID" ]; then ESTADO="desconocido"; fi
            python3 publicidad/seleccionar.py registrar --campana "$CAMPANA" --asset "$ASSET" \
              --canal "$CANAL" --formato "$FORMATO" --estado "$ESTADO" \
              --remote-id "$RID" --detalle "$DET" --fecha "${{ steps.contenido.outputs.FECHA_LOCAL }}"
          }
          C="${{ steps.contenido.outputs.CAMPANA }}"; FEED="${{ steps.contenido.outputs.ASSET_ID }}"
          STORY="${{ steps.contenido.outputs.STORY_ID }}"
          RC="${{ steps.contenido.outputs.REEL_CAMPANA }}"; REEL="${{ steps.contenido.outputs.REEL_ID }}"
          registrar "$C" "$FEED" instagram feed "${{ steps.contenido.outputs.PUBLICAR_INSTAGRAM }}" "${{ steps.instagram.outcome }}" "${{ steps.instagram.outputs.ESTADO }}" "${{ steps.instagram.outputs.REMOTE_ID }}"
          registrar "$C" "$FEED" facebook feed "${{ steps.contenido.outputs.PUBLICAR_FACEBOOK }}" "${{ steps.facebook.outcome }}" "${{ steps.facebook.outputs.ESTADO }}" "${{ steps.facebook.outputs.REMOTE_ID }}"
          registrar "$C" "$STORY" instagram story "${{ steps.contenido.outputs.PUBLICAR_STORY_INSTAGRAM }}" "${{ steps.story_instagram.outcome }}" "${{ steps.story_instagram.outputs.ESTADO }}" "${{ steps.story_instagram.outputs.REMOTE_ID }}"
          registrar "$C" "$STORY" facebook story "${{ steps.contenido.outputs.PUBLICAR_STORY_FACEBOOK }}" "${{ steps.story_facebook.outcome }}" "${{ steps.story_facebook.outputs.ESTADO }}" "${{ steps.story_facebook.outputs.REMOTE_ID }}"
          registrar "$C" "$FEED" tiktok feed "${{ steps.contenido.outputs.PUBLICAR_TIKTOK }}" "${{ steps.tiktok.outcome }}" "${{ steps.tiktok.outputs.ESTADO }}" "${{ steps.tiktok.outputs.REMOTE_ID }}"
          registrar "$RC" "$REEL" instagram reel "${{ steps.contenido.outputs.PUBLICAR_REEL_INSTAGRAM }}" "${{ steps.reel_instagram.outcome }}" "${{ steps.reel_instagram.outputs.ESTADO }}" "${{ steps.reel_instagram.outputs.REMOTE_ID }}"
          registrar "$RC" "$REEL" facebook reel "${{ steps.contenido.outputs.PUBLICAR_REEL_FACEBOOK }}" "${{ steps.reel_facebook.outcome }}" "${{ steps.reel_facebook.outputs.ESTADO }}" "${{ steps.reel_facebook.outputs.REMOTE_ID }}"
          registrar "$RC" "$REEL" tiktok reel "${{ steps.contenido.outputs.PUBLICAR_REEL_TIKTOK }}" "${{ steps.reel_tiktok.outcome }}" "${{ steps.reel_tiktok.outputs.ESTADO }}" "${{ steps.reel_tiktok.outputs.REMOTE_ID }}"
          git config user.name "Las 3 Yemas Bot"
          git config user.email "bot@las3yemas.cl"
          [ -f publicidad/registro-publicaciones.jsonl ] || exit 0
          git add publicidad/registro-publicaciones.jsonl
          git commit -m "Registro publicidad ${{ steps.contenido.outputs.FECHA_LOCAL }}" || exit 0
          git pull --rebase -q || true
          git push
