name: Publicidad diaria Las 3 Yemas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar publicidad
        run: |
          mkdir -p publicidad

          cp publicidad/plantilla-las3yemas.png publicidad/publicidad-hoy.jpg

          echo "Imagen preparada:"
          ls -lh publicidad/publicidad-hoy.jpg

      - name: Guardar publicidad
        run: |
          git config user.name "Las 3 Yemas Bot"
          git config user.email "bot@las3yemas.cl"

          git add -f publicidad/publicidad-hoy.jpg
          git commit -m "Actualizar publicidad Las 3 Yemas" || true
          git push

      - name: Esperar publicación en GitHub Pages
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/publicidad-hoy.jpg"

          echo "Esperando que GitHub Pages publique la nueva imagen..."

          for i in {1..30}; do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")

            echo "Intento $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "IMAGEN DISPONIBLE."
              exit 0
            fi

            sleep 5
          done

          echo "La imagen no quedó disponible en GitHub Pages."
          exit 1

      - name: Publicar en Instagram
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/publicidad-hoy.jpg"

          IG_USER_ID=$(curl -s \
            "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$IG_USER_ID" ]; then
            echo "No se pudo obtener el ID de Instagram."
            exit 1
          fi

          CAPTION="🥚 Huevos frescos directo a tu hogar. 💗 Calidad, frescura y confianza. 🚚 Repartimos en Viña del Mar, Valparaíso, Quilpué, Belloto y Villa Alemana. 📲 Haz tu pedido por WhatsApp o desde nuestra web. #Las3Yemas #HuevosFrescos #HuevosFrescosChile"

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "image_url=${IMAGE_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$RESPONSE"

          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$CREATION_ID" ]; then
            echo "Instagram no creó el contenido."
            exit 1
          fi

          echo "Contenido creado correctamente."

          sleep 10

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$PUBLISH_RESPONSE"

          PUBLISH_ID=$(echo "$PUBLISH_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$PUBLISH_ID" ]; then
            echo "Instagram no confirmó la publicación."
            exit 1
          fi

          echo "PUBLICACIÓN REALIZADA CORRECTAMENTE."
