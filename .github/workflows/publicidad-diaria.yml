name: Publicidad diaria Las 3 Yemas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar pieza del día
        id: contenido
        run: |
          # Día local America/Santiago. Sin campaña vigente repite la
          # rotación 0N_semana.png y la leyenda de siempre.
          python3 publicidad/seleccionar.py elegir --github-output

      - name: Preparar imagen
        run: |
          cp "${{ steps.contenido.outputs.IMAGEN }}" "publicidad/instagram-${GITHUB_RUN_ID}.png"

      - name: Guardar imagen
        run: |
          git config user.name "Las 3 Yemas Bot"
          git config user.email "bot@las3yemas.cl"
          git add "publicidad/instagram-${GITHUB_RUN_ID}.png"
          if [ "${{ steps.contenido.outputs.MODO }}" = "campana" ]; then
            FEED="${{ steps.contenido.outputs.ASSET_ID }}"; STORY="${{ steps.contenido.outputs.STORY_ID }}"
            FECHA="${{ steps.contenido.outputs.FECHA_LOCAL }}"
            for FILA in \
              "instagram $FEED ${{ steps.contenido.outputs.PUBLICAR_INSTAGRAM }}" \
              "facebook $FEED ${{ steps.contenido.outputs.PUBLICAR_FACEBOOK }}" \
              "instagram_story $STORY ${{ steps.contenido.outputs.PUBLICAR_STORY_INSTAGRAM }}" \
              "facebook_story $STORY ${{ steps.contenido.outputs.PUBLICAR_STORY_FACEBOOK }}" \
              "tiktok $FEED ${{ steps.contenido.outputs.PUBLICAR_TIKTOK }}"; do
              set -- $FILA
              if [ "$3" = "true" ]; then
                python3 publicidad/seleccionar.py registrar --canal "$1" --estado en_curso --asset "$2" --fecha "$FECHA"
              fi
            done
            if [ -f publicidad/registro-publicaciones.jsonl ]; then git add publicidad/registro-publicaciones.jsonl; fi
          fi
          git commit -m "Publicidad diaria Las 3 Yemas" || true
          git push

      - name: Esperar imagen pública
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.png"
          for i in {1..30}; do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "IMAGEN DISPONIBLE"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publicar en Instagram
        id: instagram
        if: steps.contenido.outputs.PUBLICAR_INSTAGRAM == 'true'
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CAPTION: ${{ steps.contenido.outputs.CAPTION }}
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.png"

          IG_USER_ID=$(curl -s \
            "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$IG_USER_ID" ]; then
            echo "No se obtuvo el ID de Instagram"
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "image_url=${IMAGE_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$RESPONSE"

          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$CREATION_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          sleep 10

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$PUBLISH_RESPONSE"

          PUBLISH_ID=$(echo "$PUBLISH_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$PUBLISH_ID" ]; then
            # media_publish sin ID: pudo quedar publicado o no. Revisar Instagram antes de reintentar.
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
          echo "REMOTE_ID=$PUBLISH_ID" >> "$GITHUB_OUTPUT"
          echo "INSTAGRAM PUBLICADO CORRECTAMENTE"

      # Si falla se marca en rojo, pero TikTok se ejecuta igual.
      - name: Publicar en Facebook
        id: facebook
        if: steps.contenido.outputs.PUBLICAR_FACEBOOK == 'true'
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          CAPTION: ${{ steps.contenido.outputs.CAPTION }}
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.png"
          PAGE_ID=1349788938213993
          TOKEN="$FACEBOOK_PAGE_ACCESS_TOKEN"

          # Si el secreto es un token de usuario / usuario del sistema,
          # se obtiene automáticamente el token de la página (no se imprime).
          PT=$(curl -s "https://graph.facebook.com/v26.0/${PAGE_ID}?fields=access_token&access_token=${TOKEN}" \
            | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('access_token',''))
          except Exception: print('')")
          if [ -n "$PT" ]; then
            echo "::add-mask::$PT"
            TOKEN="$PT"
            echo "Token de página obtenido automáticamente"
          else
            echo "Se usa el token guardado tal cual"
          fi

          RESP=$(curl -s -X POST \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/photos" \
            -d "url=${IMAGE_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            -d "access_token=${TOKEN}")
          echo "$RESP"

          if echo "$RESP" | grep -q '"post_id"\|"id"'; then
            FB_ID=$(echo "$RESP" | python3 -c "import sys,json
          d=json.load(sys.stdin); print(d.get('post_id') or d.get('id') or '')")
            echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
            echo "REMOTE_ID=$FB_ID" >> "$GITHUB_OUTPUT"
            echo "FACEBOOK PUBLICADO CORRECTAMENTE"
          else
            if echo "$RESP" | grep -q '"error"'; then
              echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            else
              echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            fi
            echo "FACEBOOK FALLÓ (revisa FACEBOOK_PAGE_ACCESS_TOKEN)"
            exit 1
          fi

      # Stories (solo campaña). Pasos independientes: si la cuenta no tiene
      # permiso para Stories, falla solo este paso y queda "fallido".
      - name: Publicar Story en Instagram
        id: story_instagram
        if: steps.contenido.outputs.PUBLICAR_STORY_INSTAGRAM == 'true'
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          STORY_URL: https://las3yemas-glitch.github.io/las3yemas/${{ steps.contenido.outputs.STORY }}
        run: |
          IG_USER_ID=$(curl -s \
            "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$IG_USER_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "image_url=${STORY_URL}" \
            -d "media_type=STORIES" \
            -d "access_token=${ACCESS_TOKEN}")
          echo "$RESPONSE"
          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$CREATION_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          sleep 10

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")
          echo "$PUBLISH_RESPONSE"
          PUBLISH_ID=$(echo "$PUBLISH_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$PUBLISH_ID" ]; then
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
          echo "REMOTE_ID=$PUBLISH_ID" >> "$GITHUB_OUTPUT"
          echo "STORY DE INSTAGRAM PUBLICADA"

      - name: Publicar Story en Facebook
        id: story_facebook
        if: steps.contenido.outputs.PUBLICAR_STORY_FACEBOOK == 'true'
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          STORY_URL: https://las3yemas-glitch.github.io/las3yemas/${{ steps.contenido.outputs.STORY }}
        run: |
          PAGE_ID=1349788938213993
          TOKEN="$FACEBOOK_PAGE_ACCESS_TOKEN"
          PT=$(curl -s "https://graph.facebook.com/v26.0/${PAGE_ID}?fields=access_token&access_token=${TOKEN}" \
            | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('access_token',''))
          except Exception: print('')")
          if [ -n "$PT" ]; then
            echo "::add-mask::$PT"
            TOKEN="$PT"
          fi

          # La foto se sube sin publicar y luego se usa como Story.
          PHOTO=$(curl -s -X POST \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/photos" \
            -d "url=${STORY_URL}" \
            -d "published=false" \
            -d "access_token=${TOKEN}")
          echo "$PHOTO"
          PHOTO_ID=$(echo "$PHOTO" | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('id',''))
          except Exception: print('')")
          if [ -z "$PHOTO_ID" ]; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESP=$(curl -s -X POST \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/photo_stories" \
            -d "photo_id=${PHOTO_ID}" \
            -d "access_token=${TOKEN}")
          echo "$RESP"
          POST_ID=$(echo "$RESP" | python3 -c "import sys,json
          try: print(json.load(sys.stdin).get('post_id',''))
          except Exception: print('')")
          if [ -n "$POST_ID" ]; then
            echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
            echo "REMOTE_ID=$POST_ID" >> "$GITHUB_OUTPUT"
            echo "STORY DE FACEBOOK PUBLICADA"
          elif echo "$RESP" | grep -q '"error"'; then
            echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # No debe romper el job si falla: Instagram y Facebook ya se
      # publicaron en los pasos anteriores independientemente del resultado
      # de este paso.
      - name: Publicar en TikTok
        id: tiktok
        if: steps.contenido.outputs.PUBLICAR_TIKTOK == 'true'
        continue-on-error: true
        env:
          TIKTOK_AUTOMATION_SECRET: ${{ secrets.TIKTOK_AUTOMATION_SECRET }}
          RENDER_TIKTOK_URL: ${{ vars.RENDER_TIKTOK_URL }}
          TIKTOK_IMAGEN: ${{ steps.contenido.outputs.TIKTOK_IMAGEN }}
          CAPTION: ${{ steps.contenido.outputs.CAPTION }}
        run: |
          URL="$RENDER_TIKTOK_URL"
          case "$URL" in
            https://*) ;;
            *)
              echo "RENDER_TIKTOK_URL vacía o inválida; se usa la URL por defecto"
              URL="https://las3yemas-tiktok.onrender.com"
              ;;
          esac

          # En campaña se pide el JPG de la pieza del día; sin campaña el
          # servidor usa su imagen 0N_semana.jpg de siempre.
          BODY='{}'
          if [ -n "$TIKTOK_IMAGEN" ]; then
            BODY=$(python3 -c "import json,os; print(json.dumps({'imageUrl': 'https://las3yemas-glitch.github.io/las3yemas/' + os.environ['TIKTOK_IMAGEN'], 'caption': os.environ['CAPTION']}))")
          fi

          HTTP_STATUS=$(curl -s --max-time 120 -o /tmp/tiktok_response.json -w "%{http_code}" -X POST \
            "${URL%/}/tiktok/publish" \
            -H "Authorization: Bearer ${TIKTOK_AUTOMATION_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY") || true

          echo "HTTP $HTTP_STATUS"
          cat /tmp/tiktok_response.json || true

          if [ "$HTTP_STATUS" != "200" ]; then
            if [ "$HTTP_STATUS" = "000" ]; then
              echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
            else
              echo "ESTADO=fallido" >> "$GITHUB_OUTPUT"
            fi
            echo "La publicación en TikTok falló. Revisa los logs de Render (esto no afecta a Instagram/Facebook, que ya se publicaron)."
            exit 1
          fi

          PUBLISH_ID=$(python3 -c "import json; print(json.load(open('/tmp/tiktok_response.json')).get('publish_id') or '')" || true)
          if [ -n "$PUBLISH_ID" ]; then
            echo "ESTADO=publicado" >> "$GITHUB_OUTPUT"
            echo "REMOTE_ID=$PUBLISH_ID" >> "$GITHUB_OUTPUT"
          else
            echo "ESTADO=desconocido" >> "$GITHUB_OUTPUT"
          fi

          echo "TIKTOK PUBLICADO CORRECTAMENTE"

      # Registro durable (solo en campaña). "publicado" exige ID remoto; si el
      # paso no dejó estado queda "desconocido" y no se reintenta solo.
      - name: Registrar resultado de la campaña
        if: always() && steps.contenido.outputs.MODO == 'campana'
        run: |
          registrar() {
            CANAL="$1"; ASSET="$2"; PUB="$3"; OUTCOME="$4"; ESTADO="$5"; RID="$6"
            [ "$PUB" = "true" ] || return 0
            if [ "$OUTCOME" = "skipped" ]; then
              ESTADO="fallido"; DET="paso no ejecutado"
            else
              ESTADO="${ESTADO:-desconocido}"; DET="outcome=$OUTCOME"
            fi
            if [ "$ESTADO" = "publicado" ] && [ -z "$RID" ]; then ESTADO="desconocido"; fi
            python3 publicidad/seleccionar.py registrar --canal "$CANAL" --estado "$ESTADO" \
              --remote-id "$RID" --detalle "$DET" \
              --asset "$ASSET" --fecha "${{ steps.contenido.outputs.FECHA_LOCAL }}"
          }
          FEED="${{ steps.contenido.outputs.ASSET_ID }}"; STORY="${{ steps.contenido.outputs.STORY_ID }}"
          registrar instagram "$FEED" "${{ steps.contenido.outputs.PUBLICAR_INSTAGRAM }}" "${{ steps.instagram.outcome }}" "${{ steps.instagram.outputs.ESTADO }}" "${{ steps.instagram.outputs.REMOTE_ID }}"
          registrar facebook "$FEED" "${{ steps.contenido.outputs.PUBLICAR_FACEBOOK }}" "${{ steps.facebook.outcome }}" "${{ steps.facebook.outputs.ESTADO }}" "${{ steps.facebook.outputs.REMOTE_ID }}"
          registrar instagram_story "$STORY" "${{ steps.contenido.outputs.PUBLICAR_STORY_INSTAGRAM }}" "${{ steps.story_instagram.outcome }}" "${{ steps.story_instagram.outputs.ESTADO }}" "${{ steps.story_instagram.outputs.REMOTE_ID }}"
          registrar facebook_story "$STORY" "${{ steps.contenido.outputs.PUBLICAR_STORY_FACEBOOK }}" "${{ steps.story_facebook.outcome }}" "${{ steps.story_facebook.outputs.ESTADO }}" "${{ steps.story_facebook.outputs.REMOTE_ID }}"
          registrar tiktok "$FEED" "${{ steps.contenido.outputs.PUBLICAR_TIKTOK }}" "${{ steps.tiktok.outcome }}" "${{ steps.tiktok.outputs.ESTADO }}" "${{ steps.tiktok.outputs.REMOTE_ID }}"
          git config user.name "Las 3 Yemas Bot"
          git config user.email "bot@las3yemas.cl"
          [ -f publicidad/registro-publicaciones.jsonl ] || exit 0
          git add publicidad/registro-publicaciones.jsonl
          git commit -m "Registro publicidad ${{ steps.contenido.outputs.FECHA_LOCAL }}" || exit 0
          git pull --rebase -q || true
          git push
