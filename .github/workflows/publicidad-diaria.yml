name: Publicidad diaria Las 3 Yemas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  publicar-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar contenido del día
        id: contenido
        run: |
          DIA=$(date -u +%u)

          case "$DIA" in
            1)
              IMAGEN="publicidad/plantilla-las3yemas.png"
              CAPTION="🥚 ¿Sabías que el huevo es una fuente de proteína de alta calidad? 💗 Un alimento versátil para desayunos, almuerzos y cenas. #Las3Yemas #HuevosFrescos"
              ;;
            2)
              IMAGEN="publicidad/plantilla-las3yemas.png"
              CAPTION="🍳 RECETA FÁCIL: Omelette de verduras. Huevos, espinaca, tomate, sal y pimienta. ¡Rápido, rico y fácil! 💗 #Las3Yemas #Recetas"
              ;;
            3)
              IMAGEN="publicidad/plantilla-las3yemas.png"
              CAPTION="💡 TIP DE COCINA: Guarda los huevos en un lugar fresco y evita cambios innecesarios de temperatura. 🥚💗 #Las3Yemas #TipsDeCocina"
              ;;
            4)
              IMAGEN="publicidad/plantilla-las3yemas.png"
              CAPTION="🐔 ¿SABÍAS QUE...? El color de la cáscara depende principalmente de la raza de la gallina. Blancos o cafés, lo importante es su frescura y calidad. 💗 #Las3Yemas"
              ;;
            5)
              IMAGEN="publicidad/plantilla-las3yemas.png"
              CAPTION="🚚 ¿Te quedaste sin huevos? Nosotros te los llevamos. 💗 Repartos en Viña del Mar, Valparaíso, Quilpué, Belloto y Villa Alemana. 📲 Haz tu pedido. #Las3Yemas #HuevosFrescos"
              ;;
            6)
              IMAGEN="publicidad/plantilla-las3yemas.png"
              CAPTION="🍳 IDEA PARA EL FIN DE SEMANA: Huevos para un desayuno rico y sencillo. ¿Cómo te gustan más: revueltos, fritos o pochados? 💗🥚 #Las3Yemas"
              ;;
            7)
              IMAGEN="publicidad/plantilla-las3yemas.png"
              CAPTION="❤️ DOMINGO EN FAMILIA: Un buen desayuno siempre puede empezar con huevos frescos. ¿Cuál es tu receta favorita? 🥚 #Las3Yemas"
              ;;
          esac

          echo "IMAGEN=$IMAGEN" >> "$GITHUB_OUTPUT"
          echo "CAPTION=$CAPTION" >> "$GITHUB_OUTPUT"

      - name: Preparar imagen
        run: |
          cp "${{ steps.contenido.outputs.IMAGEN }}" "publicidad/instagram-${GITHUB_RUN_ID}.jpg"

      - name: Guardar imagen
        run: |
          git config user.name "Las 3 Yemas Bot"
          git config user.email "bot@las3yemas.cl"

          git add "publicidad/instagram-${GITHUB_RUN_ID}.jpg"
          git commit -m "Publicidad diaria Las 3 Yemas" || true
          git push

      - name: Esperar imagen pública
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.jpg"

          echo "Esperando imagen..."
          echo "$IMAGE_URL"

          for i in {1..30}; do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")

            echo "Intento $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "IMAGEN DISPONIBLE"
              exit 0
            fi

            sleep 5
          done

          echo "La imagen no está disponible."
          exit 1

      - name: Publicar en Instagram
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.jpg"

          IG_USER_ID=$(curl -s \
            "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$IG_USER_ID" ]; then
            echo "No se obtuvo el ID de Instagram"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "image_url=${IMAGE_URL}" \
            --data-urlencode "caption=${{ steps.contenido.outputs.CAPTION }}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$RESPONSE"

          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$CREATION_ID" ]; then
            echo "Instagram no creó el contenido"
            exit 1
          fi

          sleep 10

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$PUBLISH_RESPONSE"

          PUBLISH_ID=$(echo "$PUBLISH_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$PUBLISH_ID" ]; then
            echo "Instagram no confirmó la publicación"
            exit 1
          fi

          echo "PUBLICACIÓN REALIZADA CORRECTAMENTE"
