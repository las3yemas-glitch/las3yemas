name: Publicidad diaria Las 3 Yemas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  publicar-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar pieza del día
        id: contenido
        run: |
          DIA=$(date -u +%u)

          case "$DIA" in
            1) IMAGEN="publicidad/01_semana.png" ;;
            2) IMAGEN="publicidad/02_semana.png" ;;
            3) IMAGEN="publicidad/03_semana.png" ;;
            4) IMAGEN="publicidad/04_semana.png" ;;
            5) IMAGEN="publicidad/05_semana.png" ;;
            6) IMAGEN="publicidad/06_semana.png" ;;
            7) IMAGEN="publicidad/07_semana.png" ;;
          esac

          echo "IMAGEN=$IMAGEN" >> "$GITHUB_OUTPUT"

      - name: Preparar imagen
        run: |
          cp "${{ steps.contenido.outputs.IMAGEN }}" \
             "publicidad/instagram-${GITHUB_RUN_ID}.png"

      - name: Guardar imagen
        run: |
          git config user.name "Las 3 Yemas Bot"
          git config user.email "bot@las3yemas.cl"

          git add "publicidad/instagram-${GITHUB_RUN_ID}.png"
          git commit -m "Publicidad diaria Las 3 Yemas" || true
          git push

      - name: Esperar imagen pública
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.png"

          for i in {1..30}; do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")
            echo "Intento $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "IMAGEN DISPONIBLE"
              exit 0
            fi

            sleep 5
          done

          exit 1

      - name: Publicar en Instagram
        env:
          ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          IMAGE_URL="https://las3yemas-glitch.github.io/las3yemas/publicidad/instagram-${GITHUB_RUN_ID}.png"

          IG_USER_ID=$(curl -s \
            "https://graph.instagram.com/me?fields=id&access_token=${ACCESS_TOKEN}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$IG_USER_ID" ]; then
            echo "No se obtuvo el ID de Instagram"
            exit 1
          fi

          CAPTION="🥚 Las 3 Yemas 💗 Huevos frescos y contenido útil para ti. 🚚 Repartimos en Viña del Mar, Valparaíso, Quilpué, Belloto y Villa Alemana. #Las3Yemas #HuevosFrescos"

          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media" \
            -d "image_url=${IMAGE_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$RESPONSE"

          CREATION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$CREATION_ID" ]; then
            exit 1
          fi

          sleep 10

          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/${IG_USER_ID}/media_publish" \
            -d "creation_id=${CREATION_ID}" \
            -d "access_token=${ACCESS_TOKEN}")

          echo "$PUBLISH_RESPONSE"

          PUBLISH_ID=$(echo "$PUBLISH_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ -z "$PUBLISH_ID" ]; then
            exit 1
          fi

          echo "PUBLICACIÓN REALIZADA CORRECTAMENTE"
